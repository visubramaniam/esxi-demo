---
####################################################################
# Step 1 : Create LDEV
####################################################################
- name: Logical Device Module
  hosts: localhost
  gather_facts: false

  vars_files:
    - ansible_vault_storage.yaml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
    ldev_size: 20

  tasks:

    ###########################################################################
    # Task 1 : Create ldev with capacity saving and data_reduction_share
    ###########################################################################
    - name: Create ldev with capacity saving and data_reduction_share
      hitachivantara.vspone_block.vsp.hv_ldev:
        connection_info: "{{ connection_info }}"
        storage_system_info:
          serial: "{{ storage_serial }}"
        state: "present"
        spec:
          pool_id: 0
          size: "{{ ldev_size }}GB"
          capacity_saving: "compression_deduplication"
          data_reduction_share: "true"
          name: "Demo"
      register: ldev_create
      # Retry only when another session holds the array's resource lock.
      until: >-
        ldev_create is not failed or
        'locked by a different user' not in (ldev_create.msg | default(''))
      retries: 5
      delay: 30

    - name: "Show ldev_create output"
      ansible.builtin.debug:
        var: ldev_create

    - name: "Set ldev_id for workflow"
      set_stats:
        data:
          ldev_id: "{{ ldev_create.volume.ldev_id }}"
