---
- name: Rescan storage on ESXi cluster
  hosts: localhost
  gather_facts: false
  collections:
    - community.vmware

  vars_files:
    - vmware_vars.yaml

  tasks:
    - name: Rescan HBAs for all hosts in the cluster and refresh storage system objects
      community.vmware.vmware_host_scanhba:
        hostname: '{{ vcenter_hostname }}'
        username: '{{ vcenter_username }}'
        password: '{{ vcenter_password }}'
        validate_certs: '{{ vcenter_validate_certs }}'
        cluster_name: '{{ cluster_name }}'
        refresh_storage: true
