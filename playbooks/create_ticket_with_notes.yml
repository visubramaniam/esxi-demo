---
- name: Create ServiceNow incident
  hosts: localhost
  gather_facts: false
  connection: local

  vars_files:
    - change_request_vars.yml

  tasks:
    # datastore_name and vmfs_device_name are produced by step 5 (set_stats)
    # and reach this playbook as extra vars when run inside the AAP workflow.
    - name: Verify datastore details are present
      ansible.builtin.assert:
        that:
          - datastore_name is defined
          - vmfs_device_name is defined
          - vmfs_device_name | length > 0
        fail_msg: "datastore_name / vmfs_device_name not set; run this after step 5 in the same AAP workflow."

    - name: Create an incident
      servicenow.servicenow.snow_record:
        state: present
        table: incident
        username: "{{ sn_username }}"
        password: "{{ sn_password }}"
        instance: "{{ sn_instance }}"
        data:
          severity: "{{ sn_severity }}"
          priority: "{{ sn_priority }}"
          short_description: "Datastore {{ datastore_name }} created on Hitachi LDEV"
          description: |-
            Datastore name: {{ datastore_name }}
            LDEV NAA ID: {{ vmfs_device_name }}
      register: new_incident

    - name: Set INC for workflow
      ansible.builtin.set_stats:
        data:
          inc_number: "{{ new_incident.record.number }}"

    - name: Show incident number
      ansible.builtin.debug:
        msg: "Incident created: {{ new_incident.record.number }}"
