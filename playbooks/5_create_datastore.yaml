---
- name: Create VMFS datastore
  hosts: localhost
  gather_facts: false
  collections:
    - community.vmware

  vars_files:
    - vmware_vars.yaml

  tasks:
    # vmfs_device_name is produced by step 1 (set_stats) and reaches this
    # playbook as an extra var when run inside the AAP workflow.
    - name: Verify required variables are present
      ansible.builtin.assert:
        that:
          - vmfs_device_name is defined
          - vmfs_device_name | length > 0
        fail_msg: "vmfs_device_name not set; run step 1 first (same AAP workflow) or pass it as an extra var."

    # The VMFS volume is formatted once, from a single host. Creating it on
    # more than one host would attempt to re-format the device.
    - name: Create VMFS datastore on one ESXi host
      community.vmware.vmware_host_datastore:
        hostname: '{{ vcenter_hostname }}'
        username: '{{ vcenter_username }}'
        password: '{{ vcenter_password }}'
        validate_certs: '{{ vcenter_validate_certs }}'
        esxi_hostname: '{{ esxi_hostname }}'
        datastore_name: '{{ datastore_name }}'
        datastore_type: '{{ datastore_type }}'
        vmfs_device_name: '{{ vmfs_device_name }}'
        vmfs_version: 6

    # Remaining hosts discover the existing VMFS datastore via a rescan.
    - name: Rescan cluster so every host sees the new datastore
      community.vmware.vmware_host_scanhba:
        hostname: '{{ vcenter_hostname }}'
        username: '{{ vcenter_username }}'
        password: '{{ vcenter_password }}'
        validate_certs: '{{ vcenter_validate_certs }}'
        cluster_name: '{{ cluster_name }}'
        refresh_storage: true
