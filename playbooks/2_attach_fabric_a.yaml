####################################################################
# Step 2 : Attach LDEV to hostgroup on CL1-A (fabric A)
####################################################################
- name: Attach LDEV to fabric A hostgroup
  hosts: localhost
  gather_facts: false
  collections:
    - hitachivantara.vspone_block.vsp

  vars_files:
    - ansible_vault_storage.yaml
    - vsp_direct_variables.yaml

  vars:
    # Common connection info for all tasks
    # lock_token is produced by 0_lock_array.yaml (set_stats) in the AAP workflow.
    # When present, it replaces username/password for operations on locked resources.
    connection_info: >-
      {{ {'address': storage_address} | combine(
           {'api_token': lock_token} if lock_token is defined
           else {'username': vault_storage_username, 'password': vault_storage_secret}) }}
  tasks:
    - name: Present ldevs to hostgroup CL1-A
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        state: "present"
        storage_system_info:
          serial: "{{ storage_serial }}"
        spec:
          name: "{{hostgroup_name_1}}"
          port: "{{hostgroup_port_1}}"
          host_mode: "{{ hostgroup_host_mode_1 }}"
          host_mode_options: "{{ hostgroup_host_mode_options_1 }}"
          ldevs: "{{ ldev_id }}"
      register: host_group_create
      # Retry only when another session holds the array's resource lock.
      until: >-
        host_group_create is not failed or
        'locked by a different user' not in (host_group_create.msg | default(''))
      retries: 5
      delay: 30

    - name: Show host group creation result
      ansible.builtin.debug:
        var: host_group_create
